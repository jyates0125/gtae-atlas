name: Atlas 36.7 - terrain import race and release hold
on:
  pull_request:
    branches: [feature/atlas294-integrated-staging-20261122, development]
    paths:
      - 'atlas-navigation.js'
      - 'atlas-vi.html'
      - 'scripts/audit_atlas367_heightfield_release.cjs'
      - 'scripts/test_atlas367_release_elevation.cjs'
      - 'scripts/test_atlas367_terrain_import_race_browser.py'
      - 'docs/ATLAS367-TERRAIN-IMPORT-AND-RELEASE-GATE.md'
      - '.github/workflows/atlas367-terrain-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terrain-import-and-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Source, binary and authorisation proof regression
        run: |
          node --check atlas-navigation.js
          node scripts/test_heightfield_import.cjs
          node scripts/test_atlas366_heightfield_first.cjs
          node scripts/test_atlas367_release_elevation.cjs
      - name: Build, protect and audit Cloudflare release payload
        run: |
          node scripts/build-cloudflare.cjs
          node scripts/audit_atlas367_heightfield_release.cjs
          python scripts/audit_published.py
      - name: Prepare focused Chromium
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Real browser 3D upload during fetch and fallback
        run: |
          python scripts/test_atlas367_terrain_import_race_browser.py
          python scripts/test_atlas366_heightfield_first_browser.py
          python scripts/test_atlas362_vi_map_clarity_browser.py
