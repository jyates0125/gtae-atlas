name: Team Jura Atlas - optional designed-brand visual sweep
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-visual-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  visual-review:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            browser: chromium
          - runner: windows-latest
            browser: msedge
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the reviewed revision
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install ${{ matrix.browser }}
      - name: Capture full-site review when needed
        env:
          ATLAS_BROWSER: ${{ matrix.browser }}
        run: python scripts/capture_design_review.py
      - name: Preserve advisory visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-advisory-visual-${{ matrix.browser }}-${{ github.sha }}
          path: qa-evidence/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 21
