name: Atlas 32.4 - One Last Ride 4m15 storyboard animatic
on:
  pull_request:
    branches: [feature/atlas294-integrated-staging-20261122]
    paths:
      - 'one-last-ride.html'
      - 'film/production/CONDENSED-CUT-255S.json'
      - 'film/production/README.md'
      - 'scripts/render_one_last_ride_animatic.py'
      - 'scripts/test_atlas324_film_contract.py'
      - '.github/workflows/atlas324-olr-animatic.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas324-film-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  film-source-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local frame composition dependency
        run: python -m pip install Pillow==11.3.0
      - name: Check only the changed film source contracts
        run: |
          python -m py_compile scripts/render_one_last_ride_animatic.py scripts/test_atlas324_film_contract.py
          python scripts/test_atlas324_film_contract.py
          ffmpeg -version
      - name: Build Cloudflare static payload and verify changed film page
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Render and probe 18-second editorial smoke, including original audio
        run: |
          python scripts/render_one_last_ride_animatic.py --quick --output qa-evidence/film/one-last-ride-animatic-smoke.mp4
      - name: Retain smoke evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas324-film-smoke-failure
          path: qa-evidence/film/*
          if-no-files-found: warn
          retention-days: 7
  render-full-animatic:
    runs-on: ubuntu-24.04
    needs: [film-source-and-smoke]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local frame composition dependency
        run: python -m pip install Pillow==11.3.0
      - name: Render and verify full 255-second animatic — not finished film
        run: |
          python scripts/render_one_last_ride_animatic.py --output qa-evidence/film/one-last-ride-415-animatic.mp4
      - name: Keep owner-only GitHub Actions film review artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas324-olr-415-animatic-review-not-final-film
          path: |
            qa-evidence/film/one-last-ride-415-animatic.mp4
            qa-evidence/film/one-last-ride-415-animatic.manifest.json
          if-no-files-found: error
          retention-days: 30
