name: Atlas 30.2 - seven classic notebook recovery
on:
  pull_request:
    branches: [development, feature/atlas294-integrated-staging-20261122]
    paths:
      - 'atlas98-classic.js'
      - 'atlas98-classic.css'
      - 'map-hub.html'
      - 'scripts/test_atlas302_classic_safe.py'
      - 'scripts/test_atlas302_classic_browser.py'
      - '.github/workflows/atlas302-classic-notebook.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas302-classic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  seven-worlds-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify classic storage integrity and JavaScript syntax
        run: |
          python scripts/test_atlas302_classic_safe.py
          python -m py_compile scripts/test_atlas302_classic_browser.py
      - name: Build real Cloudflare payload and asset audit
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install Chromium for affected classic map notebooks only
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Verify seven game worlds at 390px and 1440px with stale/corrupt saves
        run: python scripts/test_atlas302_classic_browser.py
      - name: Retain original mobile and desktop recovery UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas302-classic-notebook-390-1440
          path: qa-evidence/chromium/atlas302-classic-recovery-*.png
          if-no-files-found: warn
          retention-days: 14
