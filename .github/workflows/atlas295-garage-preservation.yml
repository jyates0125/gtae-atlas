name: Atlas 29.5 - Garage local progress safety
on:
  pull_request:
    branches: [development, feature/atlas294-integrated-staging-20261122]
    paths:
      - 'atlas101-configurator.js'
      - 'atlas93-garage.js'
      - 'scripts/test_atlas295_garage_safety.py'
      - 'scripts/test_atlas295_garage_multitab_browser.py'
      - '.github/workflows/atlas295-garage-preservation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas295-garage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guest-storage-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip unrelated pull-request synchronizations
        id: scope
        env:
          ATLAS_PR_ACTION: ${{ github.event.action }}
        run: python3 scripts/atlas300-ci-delta.py .github/workflows/atlas295-garage-preservation.yml
      - name: Verify scoped saves and syntax only
        if: steps.scope.outputs.run == 'true'
        run: |
          python scripts/test_atlas295_garage_safety.py
          python -m py_compile scripts/test_atlas295_garage_multitab_browser.py
          node --check atlas93-garage.js
      - name: Build and audit actual Cloudflare payload
        if: steps.scope.outputs.run == 'true'
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install Chromium for Garage scenarios
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Test only Garage storage, Forge handoff and backup behavior
        if: steps.scope.outputs.run == 'true'
        run: |
          python scripts/test_atlas295_garage_multitab_browser.py
          python scripts/test_atlas293_garage_forge_browser.py
