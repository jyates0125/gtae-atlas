name: Leonida mobile standalone validation - shadow pilot
on:
  pull_request:
    branches: [development]
    paths:
      - '.github/workflows/leonida-mobile-shadow.yml'
      - 'docs/LEONIDA-MOBILE-VALIDATION-INVENTORY.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
          - os: windows-latest
            browser: msedge
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and audit exact public payload
        shell: bash
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install pinned browser tooling
        shell: bash
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install ${{ matrix.browser }}
      - name: VI mobile marker details and controls
        env:
          ATLAS_BROWSER: ${{ matrix.browser }}
        run: python scripts/test_atlas220_vi_mobile_browser.py
      - name: Save independent VI mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leonida-mobile-shadow-${{ matrix.browser }}
          path: qa-evidence/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 21
