name: Atlas 39.3 — activity availability and search areas
on:
  pull_request:
    branches: [development]
    paths:
      - 'atlas.js'
      - 'atlas.css'
      - 'atlas-online.html'
      - 'atlas-conditions.js'
      - 'atlas88-events.*'
      - 'atlas180-cayo-flagship.*'
      - 'atlas181-cayo-hotspots.*'
      - 'scripts/test_atlas171_browser.py'
      - 'scripts/test_atlas383_cayo_daily.cjs'
      - 'scripts/test_atlas393_activity_browser.py'
      - '.github/workflows/atlas393-activity-availability.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas393-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  activity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Source and rule checks
        run: |
          node --check atlas.js
          node --check atlas88-events.js
          node --check atlas180-cayo-flagship.js
          node --check atlas181-cayo-hotspots.js
          node scripts/test_atlas383_cayo_daily.cjs
          python -m py_compile scripts/test_atlas393_activity_browser.py scripts/test_atlas171_browser.py
      - name: Build public preview
        run: node scripts/build-cloudflare.cjs
      - name: Install browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install chromium
      - name: Verify Online sidebar and Cayo daily legend
        run: |
          python scripts/test_atlas393_activity_browser.py
          python scripts/test_atlas171_browser.py
