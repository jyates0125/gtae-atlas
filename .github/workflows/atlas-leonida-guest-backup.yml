name: Leonida guest backup integration
on:
  pull_request:
    branches: [development]
    paths:
      - 'atlas-account.html'
      - 'atlas131-account.js'
      - 'atlas-vi-backup-plan.js'
      - 'atlas-vi-journey.js'
      - 'atlas-objective-core.js'
      - 'tests/atlas-vi-backup-plan.test.cjs'
      - 'scripts/test_leonida_guest_backup_browser.py'
      - '.github/workflows/atlas-leonida-guest-backup.yml'
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check atlas131-account.js && node --test tests/atlas-vi-backup-plan.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/build-cloudflare.cjs
      - run: pip install playwright==1.58.0 && python -m playwright install --with-deps chromium
      - run: python scripts/test_leonida_guest_backup_browser.py
