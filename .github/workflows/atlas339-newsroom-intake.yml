name: Atlas 33.9 - official Newsroom intake
on:
  pull_request:
    branches: [feature/atlas294-integrated-staging-20261122, development, main]
    paths:
      - atlas103-hub.js
      - atlas-news.html
      - data/atlas-news-cheats.json
      - scripts/*atlas339*
      - .github/workflows/atlas339-newsroom-intake.yml
  push:
    branches:
      - feature/atlas339-official-newsroom-intake-20261123
    paths:
      - scripts/atlas339-newswire-intake.cjs
      - scripts/test_atlas339-newswire-intake.cjs
      - scripts/test_atlas339_newsroom_browser.py
      - atlas-news.html
      - data/atlas-news-cheats.json
      - .github/workflows/atlas339-newsroom-intake.yml
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
permissions:
  contents: read
jobs:
  offline-contract:
    name: Rockstar link and intake safety tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_atlas339-newswire-intake.cjs
      - run: |
          node - <<'NODE'
          const feed=require('./data/atlas-news-cheats.json');
          const urls=feed.news.map(x=>x.url);
          if(feed.schema!==1||!urls.length||new Set(urls).size!==urls.length)process.exit(1);
          if(urls.some(x=>!/^https:\/\/www\.rockstargames\.com\/newswire\/article\/|^https:\/\/support\.rockstargames\.com\/articles\//.test(x)))process.exit(1);
          console.log('PASS official source domains and unique reviewed links');
          NODE
      - name: Assemble exact Cloudflare build
        run: node scripts/build-cloudflare.cjs
      - name: Install focused Chromium browser
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Check actual Newsroom mobile and desktop behavior
        run: python scripts/test_atlas339_newsroom_browser.py
  remote-intake:
    name: Rockstar discovery artifact only, no publishing
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[source-smoke]'))
    needs: offline-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/atlas339-newswire-intake.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: atlas339-official-review-candidates
          path: qa-evidence/atlas339-newswire-candidates.json
          retention-days: 14
