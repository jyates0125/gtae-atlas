name: Atlas 47.3 — local crew workspaces
on:
  pull_request:
    branches: [development]
    paths:
      - 'atlas140-crew.js'
      - 'atlas131-account.js'
      - 'atlas-account.html'
      - 'atlas140-crew.css'
      - 'my-crew.html'
      - 'scripts/test_atlas140_crew_profiles.cjs'
      - 'scripts/test_atlas140_crew_profiles_browser.py'
      - '.github/workflows/atlas4735-crew-profiles.yml'
permissions:
  contents: read
jobs:
  crew:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
          - os: windows-latest
            browser: msedge
    runs-on: ${{ matrix.os }}
    env:
      ATLAS_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: node scripts/test_atlas140_crew_profiles.cjs
      - run: node scripts/build-cloudflare.cjs
      - run: python -m pip install playwright==1.58.0
      - if: matrix.browser == 'chromium'
        run: python -m playwright install --with-deps chromium
      - if: matrix.browser == 'msedge'
        run: python -m playwright install msedge
      - run: python scripts/test_atlas140_crew_profiles_browser.py
