name: Team Jura Atlas - validate production website
on:
  # Only production promotion PRs trigger full validation; routine development stays focused.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jura-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-and-static:
   if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
   runs-on: ubuntu-24.04 
   timeout-minutes: 30
   steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit the entire source tree
        run: python scripts/audit_release.py
      - name: Existing Atlas map and routing regressions
        shell: bash
        run: |
          failures=0
          check() { echo "::group::$*"; if "$@"; then echo "PASS: $*"; else echo "::error::FAILED: $*"; failures=$((failures+1)); fi; echo "::endgroup::"; }
          check python scripts/test_site_release_70.py
          check python scripts/test_atlas_static.py
          check python scripts/test_atlas125_media_cheats.py
          check python scripts/test_social_preview_129.py
          check python scripts/test_atlas209_discovery.py
          check node scripts/test_atlas209_legacy_redirect.cjs
          check node --check scripts/atlas209-legacy-redirect.cjs
          check python scripts/test_launch_130.py
          check python scripts/test_atlas134_events.py
          check python scripts/test_atlas135_feed.py
          check python scripts/test_atlas136_status.py
          check python scripts/test_atlas139_nav_focus.py
          check python scripts/test_social_icons_131.py
          check python scripts/test_atlas153_welcome_social.py
          check python scripts/test_account_131.py
          check python scripts/test_atlas208_https_auth.py
          check python scripts/test_atlas138_supabase.py
          check python scripts/test_atlas141_leonida_research.py
          check python scripts/test_atlas142_official_sources.py
          check python scripts/test_atlas143_official_view.py
          check node --check atlas143-official-map-view.js
          check python scripts/test_atlas290_poster_source.py
          check python scripts/test_atlas291_dual_leonida.py
          check node --check atlas290-official-landmarks.js
          check node --check atlas131-account.js
          check node --check atlas131-social-icons.js
          check node --check atlas130-share.js
          check python scripts/test_catalog_design_127.py
          check python scripts/test_hubs_103.py
          check python scripts/test_game_art_121.py
          check python scripts/test_map_chrome_128.py
          check python scripts/test_classic_flat_106.py
          check python scripts/test_atlas150_classic_slots.py
          check python scripts/test_atlas157_classic_zoom.py
          check node --check atlas103-hub.js
          check node --check atlas98-portal.js
          check node --check atlas98-worlds.js
          check node --check atlas100-universe.js
          check python scripts/test_sync_gtadb_vi.py
          check python tools/test_atlas96.py
          check python tools/test_atlas97.py
          check node test-route-58.cjs
          check node test-layer-deck-621.cjs
          check python -m unittest discover -s tests -p 'test_atlas98b_sync.py'
          check python -m unittest discover -s tests -p 'test_atlas99_map_data.py'
          test "$failures" -eq 0
      - name: Safe Data Lab import and map pack tests
        shell: bash
        run: |
          failures=0
          check() { echo "::group::$*"; if "$@"; then echo "PASS: $*"; else echo "::error::FAILED: $*"; failures=$((failures+1)); fi; echo "::endgroup::"; }
          check node --test tests/data-lab.test.cjs
          check node --test tests/source-identity.test.cjs
          check node --test tests/atlas140-cloud-saves.test.cjs
          check node --test tests/atlas144-cloud-transfer.test.cjs
          check node --check atlas144-cloud-transfer.js
          check node --check atlas144-device-overview.js
          check python scripts/test_atlas144_account_review.py
          check python scripts/test_atlas145_map_ux.py
          check python scripts/test_atlas146_launch_truth.py
          check python scripts/test_atlas147_garage_mobile.py
          check python scripts/test_atlas148_local_covers.py
          check python scripts/test_atlas155_premium_art.py
          check python scripts/test_atlas157_cinematic_world_covers.py
          check python scripts/test_atlas155_art_review.py
          check python scripts/test_atlas157_directory.py
          check python scripts/test_atlas212_directory.py
          check python scripts/test_atlas158_browser_contract.py
          check python scripts/test_atlas159_duplicate_nav.py
          check python scripts/test_atlas149_leonida_toolbar.py
          check python scripts/test_atlas154_map_zoom.py
          check python scripts/test_atlas156_mobile_nav.py
          check python scripts/test_atlas151_heist_gallery.py
          check python scripts/test_atlas160_premium_headers.py
          check python scripts/test_atlas158_premium_experiences.py
          check python scripts/test_atlas161_quality_gate.py
          check python scripts/test_atlas162_subject_heroes.py
          check python scripts/test_atlas3904_header_pack.py --require
          check python scripts/test_atlas3906_action_cut.py
          check python scripts/test_atlas163_premium_asset_ledger.py
          check python scripts/test_atlas164_heist_workspace.py
          check python scripts/test_atlas165_evidence_brand.py
          check python scripts/test_atlas166_release_status.py
          check python scripts/test_atlas167_heist_focus.py
          check python scripts/test_atlas168_heist_guides.py
          check python scripts/test_atlas169_heist_views.py
          check python scripts/test_atlas170_cayo_unified.py
          check python scripts/test_atlas171_cayo_board.py
          check python scripts/test_atlas216_cayo_dock.py
          check python scripts/test_atlas180_cayo_flagship.py
          check python scripts/test_atlas181_cayo_hotspots.py
          check python scripts/test_atlas184_cayo_visible_symbols.py
          check python scripts/test_atlas185_cayo_polish.py
          check python scripts/test_atlas186_cayo_route.py
          check python scripts/test_atlas192_world_completion.py
          check python scripts/test_atlas207_policies.py
          check python scripts/test_atlas195_source_tags.py
          check node --check atlas195-source-tags.js
          check python scripts/test_atlas196_legacy_explorer.py
          check node --check atlas90-gallery.js
          check node --check atlas192-weapons6.js
          check node --check film/atlas192-storyboard.js
          check python scripts/test_atlas190_marker_parity.py
          check python -m py_compile scripts/test_atlas190_marker_parity.py scripts/test_atlas190_map_browser.py scripts/test_atlas210_iv_touch_browser.py scripts/test_atlas211_mobile_fit_browser.py scripts/test_atlas212_directory_browser.py scripts/test_atlas217_vi_world_browser.py scripts/test_atlas222_vi_browser.py scripts/test_atlas223_home_browser.py scripts/test_atlas218_yanis_v18_browser.py
          check node --check atlas217-vi-world.js
          check node --check atlas172-research-map.js
          check node --check atlas-research.js
          check node --check atlas81-hq.js
          check node --check atlas-iv.js
          check node --check atlas190-sa-route.js
          check node --check atlas186-cayo-route.js
          check node --check atlas185-cayo-polish.js
          check node --check atlas171-cayo-board.js
          check node --check atlas180-cayo-flagship.js
          check node --check atlas181-cayo-hotspots.js
          check python scripts/test_atlas171_research_map.py
          check python scripts/test_atlas217_vi_world.py
          check python scripts/test_atlas172_research_map.py
          check python scripts/test_atlas218_yanis_v18.py
          check python scripts/test_atlas290_vi_day.py
          check python -m py_compile scripts/test_atlas290_vi_day_browser.py
          check python scripts/test_atlas219_hq_premium.py
          check python scripts/test_atlas220_vi_mobile.py
          check node --check atlas220-vi-mobile.js
          check node --check atlas220-cayo-recovery.js
          check node --check atlas164-heist-workspace.js
          check node --check heist-pages.js
          check python scripts/test_atlas152_art.py
          check python scripts/test_atlas222_vi_launch.py
          check python scripts/test_atlas223_home.py
          check node --check atlas223-home.js
          check node --check atlas132-nav.js
          check node --check atlas222-characters.js
          check node --check atlas290-vi-source-ledger.js
          check node --check atlas222-vi-release.js
          check node --check atlas93-global.js
          check node --check leonida-hq.js
          check node --check atlas145-leonida-map-ux.js
          check node --check atlas145-mobile-map-entry.js
          test "$failures" -eq 0
      - name: Confirm four evidence workspaces use original page-specific artwork
        run: python scripts/test_research_identity_127.py
      - name: Build only public, approved static files (no live imports)
        run: node scripts/build-cloudflare.cjs
      - name: Verify the actual Cloudflare deployment payload
        run: python scripts/audit_published.py
      - name: Install Playwright Chromium
        run: |
          python -m pip install 'playwright==1.58.0'
          timeout 120s python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Leonida in-game Day and official poster targeted browser preflight
        # Fail early on VI regressions before the 190-page sweep and Cayo suite.
        shell: bash
        env:
          ATLAS_BROWSER: chromium
        run: |
          python scripts/test_atlas290_vi_day_browser.py
          python scripts/test_atlas290_poster_browser.py
      - name: Desktop and mobile browser QA on served production files
        env:
          ATLAS_BROWSER: chromium
        run: |
          python scripts/test_atlas3905_header_browser.py
          python scripts/test_atlas3906_action_cut.py
          python scripts/browser_smoke.py
      - name: Verify classic worlds, offline recovery, navigation and VI feature journeys
        env:
          ATLAS_BROWSER: chromium
        run: |
          python scripts/test_atlas190_map_browser.py
          python scripts/test_atlas278_offline_browser.py
          python scripts/test_atlas210_iv_touch_browser.py
          python scripts/test_atlas211_mobile_fit_browser.py
          python scripts/test_atlas212_directory_browser.py
          python scripts/test_atlas217_vi_world_browser.py
          python scripts/test_atlas222_vi_browser.py
          python scripts/test_atlas223_home_browser.py
          python scripts/test_atlas218_yanis_v18_browser.py
          python scripts/test_atlas219_hq_browser.py
          python scripts/test_atlas201_squalo_browser.py
          python scripts/test_atlas191_first_visit_browser.py
      - name: Save functional QA and targeted visual evidence (Chromium)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: team-jura-atlas-design-review-chromium
          path: |
            qa-evidence/chromium/
            qa-evidence/atlas3905-cinematic-headers/
          if-no-files-found: warn
          retention-days: 14
  microsoft-edge:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build production site
        run: node scripts/build-cloudflare.cjs
      - name: Audit production output
        run: python scripts/audit_published.py
      - name: Install Playwright and Microsoft Edge
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install msedge
      - name: Leonida in-game Day and official poster targeted browser preflight (Edge)
        shell: bash
        env:
          ATLAS_BROWSER: msedge
        run: |
          python scripts/test_atlas290_vi_day_browser.py
          python scripts/test_atlas290_poster_browser.py
      - name: Microsoft Edge desktop/mobile functional smoke tests
        env:
          ATLAS_BROWSER: msedge
        run: |
          python scripts/test_atlas3905_header_browser.py
          python scripts/test_atlas3906_action_cut.py
          python scripts/browser_smoke.py
      - name: Verify classic worlds, offline recovery, navigation and VI feature journeys
        # Git Bash uses fail-fast (-e); PowerShell otherwise hides an earlier
        # native Python failure when a later command exits successfully.
        shell: bash
        env:
          ATLAS_BROWSER: msedge
        run: |
          python scripts/test_atlas190_map_browser.py
          python scripts/test_atlas278_offline_browser.py
          python scripts/test_atlas210_iv_touch_browser.py
          python scripts/test_atlas211_mobile_fit_browser.py
          python scripts/test_atlas212_directory_browser.py
          python scripts/test_atlas217_vi_world_browser.py
          python scripts/test_atlas222_vi_browser.py
          python scripts/test_atlas223_home_browser.py
          python scripts/test_atlas218_yanis_v18_browser.py
          python scripts/test_atlas219_hq_browser.py
          python scripts/test_atlas201_squalo_browser.py
          python scripts/test_atlas191_first_visit_browser.py
      - name: Save functional QA and targeted visual evidence (Edge)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: team-jura-atlas-design-review-edge
          path: |
            qa-evidence/msedge/
            qa-evidence/atlas3905-cinematic-headers/
          if-no-files-found: warn
          retention-days: 14
  # Fast, isolated Atlas 22.0 gate. Finds phone popup regressions before the
  # broader 80-page Chromium/Edge smoke and heist suites complete.
  atlas22-focus-chromium:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate category symbols and build exact staging payload
        run: |
          python scripts/test_atlas220_vi_mobile.py
          node --check atlas.js
          node --check atlas220-vi-mobile.js
          node --check atlas220-cayo-recovery.js
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install focused Chromium
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install chromium
      - name: Test character portraits, world navigation and private routes
        env:
          ATLAS_BROWSER: chromium
        run: python scripts/test_atlas_character_portraits.py
      - name: Test VI pin details, viewport fit and legend at desktop/phone widths
        env:
          ATLAS_BROWSER: chromium
        run: python scripts/test_atlas220_vi_mobile_browser.py
      - name: Verify Cayo marker detail geometry and map polish initialization
        env:
          ATLAS_BROWSER: chromium
        run: python scripts/test_atlas171_browser.py
      - name: Verify Cayo route start survives slow dynamic map initialization
        env:
          ATLAS_BROWSER: chromium
        run: python scripts/test_atlas186_route_browser.py
      - name: Verify approved Salvage Yard hero image decodes on real page
        env:
          ATLAS_BROWSER: chromium
        run: python scripts/test_atlas220_salvage_art_browser.py
      - name: Save Atlas 22.0 focus screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas22-vi-focus-chromium
          path: qa-evidence/chromium/
          if-no-files-found: warn
          retention-days: 14
  atlas22-focus-edge:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate category symbols and build exact staging payload
        run: |
          python scripts/test_atlas220_vi_mobile.py
          node --check atlas.js
          node --check atlas220-vi-mobile.js
          node --check atlas220-cayo-recovery.js
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install focused Microsoft Edge
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install msedge
      - name: Test character portraits, world navigation and private routes
        env:
          ATLAS_BROWSER: msedge
        run: python scripts/test_atlas_character_portraits.py
      - name: Test VI pin details, viewport fit and legend at desktop/phone widths
        env:
          ATLAS_BROWSER: msedge
        run: python scripts/test_atlas220_vi_mobile_browser.py
      - name: Verify Cayo marker detail geometry and map polish initialization
        env:
          ATLAS_BROWSER: msedge
        run: python scripts/test_atlas171_browser.py
      - name: Verify Cayo route start survives slow dynamic map initialization
        env:
          ATLAS_BROWSER: msedge
        run: python scripts/test_atlas186_route_browser.py
      - name: Verify approved Salvage Yard hero image decodes on real page
        env:
          ATLAS_BROWSER: msedge
        run: python scripts/test_atlas220_salvage_art_browser.py
      - name: Save Atlas 22.0 focus screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas22-vi-focus-edge
          path: qa-evidence/msedge/
          if-no-files-found: warn
          retention-days: 14
  validated-zip:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    needs: [chromium-and-static, microsoft-edge, atlas22-focus-chromium, atlas22-focus-edge]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild validated production files
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - uses: actions/upload-artifact@v4
        with:
          name: team-jura-atlas-cloudflare-validated-after-chromium-and-edge
          path: public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 21
      - name: Owner visual signoff — prevent artwork regression release
        run: python scripts/test_atlas151_visual_release.py
