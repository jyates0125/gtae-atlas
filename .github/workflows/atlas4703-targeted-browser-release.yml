name: Atlas 47.0.3 - targeted release browser retry
on:
  pull_request:
    branches: [development]
    paths:
      - scripts/browser_smoke.py
      - .github/workflows/atlas4703-targeted-browser-release.yml
permissions:
  contents: read
jobs:
  remaining-browser-checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
          - os: windows-latest
            browser: msedge
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      ATLAS_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and audit exact corrected candidate
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install ${{ matrix.browser }}
      - name: Retry only the three outstanding browser journeys
        shell: bash
        run: |
          failures=0
          check() { if "$@"; then echo "PASS: $*"; else echo "::error::FAILED: $*"; failures=$((failures+1)); fi; }
          check python scripts/test_atlas212_directory_browser.py
          check python scripts/test_atlas222_vi_browser.py
          check python scripts/test_atlas201_squalo_browser.py
          test "$failures" -eq 0
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas4703-browser-review-${{ matrix.browser }}
          path: |
            docs/RELEASE-98C-*-BROWSER-SMOKE.json
            qa-evidence/
          if-no-files-found: warn
          retention-days: 14
  validated-zip:
    needs: [remaining-browser-checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and audit release files
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
          python scripts/test_atlas151_visual_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: atlas4703-validated-public
          path: public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 21
