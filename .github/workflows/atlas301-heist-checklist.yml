name: Atlas 30.1 - heist checklist progress rescue
on:
  pull_request:
    branches: [development, feature/atlas294-integrated-staging-20261122]
    paths:
      - 'heist-pages.js'
      - 'atlas301-heist-checklist.css'
      - 'scripts/test_atlas301_heist_checklist.py'
      - 'scripts/test_atlas301_heist_checklist_browser.py'
      - '.github/workflows/atlas301-heist-checklist.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas301-heist-checklist-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  heist-checklist-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 15 heists and exact affected script syntax
        run: |
          python scripts/test_atlas301_heist_checklist.py
          python -m py_compile scripts/test_atlas301_heist_checklist_browser.py
          node --check heist-pages.js
      - name: Build and audit public Cloudflare payload
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install focused Chromium browser
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Verify all 15 checklist pages at 390px and 1440px
        run: |
          python scripts/test_atlas301_heist_checklist_browser.py
          python scripts/test_atlas299_heist_backup_browser.py
      - name: Save affected heist screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas301-heist-checklist-rescue-mobile-desktop
          path: qa-evidence/chromium/atlas301-*.png
          if-no-files-found: warn
          retention-days: 14
