name: GTAE - canonical production boundary and optional legacy diagnostic
on:
  pull_request:
    branches: [development]
    paths:
      - 'scripts/verify_cloudflare_dual_release.py'
      - 'scripts/test_atlas338_dual_release.py'
      - 'scripts/audit_atlas345_cloudflare_source_boundary.py'
      - '.github/workflows/atlas338-dual-cloudflare-release.yml'
  push:
    branches: [development]
  schedule:
    - cron: '37 13 * * *'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Expected production main SHA (blank resolves current main HEAD)"
        required: false
        type: string
      check_legacy:
        description: "Explicitly audit retired legacy hostname as well (diagnostic; will fail if unreachable)"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: atlas338-origin-contract-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          python scripts/test_atlas338_dual_release.py
          python -m py_compile scripts/audit_atlas345_cloudflare_source_boundary.py
  live-verify:
    # Public origin is main only. A development push must never require
    # production to serve development or anonymous protected-preview access.
    # Exact PR preview evidence and owner device acceptance remain separate gates.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve exact production main HEAD
        id: revision
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          SHA="${REQUESTED_SHA:-$(git ls-remote https://github.com/jyates0125/gtae-atlas.git refs/heads/main | cut -f1)}"
          if [[ ! "$SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "Invalid full production commit SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Verify public production identity and optional legacy diagnostic
        env:
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
          CHECK_LEGACY: ${{ inputs.check_legacy }}
        shell: bash
        run: |
          args=()
          if [ "$CHECK_LEGACY" = true ]; then args+=(--check-legacy); fi
          for attempt in 1 2 3 4 5; do
            if python scripts/verify_cloudflare_dual_release.py --expected-sha "$EXPECTED_SHA" "${args[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 90; fi
          done
          echo "Requested deployment identity is stale/unverified." >&2
          exit 1
      - name: Reject raw repository files served by requested public origins
        env:
          CHECK_LEGACY: ${{ inputs.check_legacy }}
        shell: bash
        run: |
          if [ "$CHECK_LEGACY" = true ]; then
            python scripts/audit_atlas345_cloudflare_source_boundary.py
          else
            python scripts/audit_atlas345_cloudflare_source_boundary.py --primary-only
          fi
