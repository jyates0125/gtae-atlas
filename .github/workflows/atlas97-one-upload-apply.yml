name: Apply Team Jura Atlas 9.7 one-upload designed-brand release
on:
  workflow_dispatch:
    inputs:
      confirm_branch:
        description: 'Type development to confirm preview branch only'
        required: true
        default: development
permissions:
  contents: write
concurrency:
  group: atlas97-development-release
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/development' && inputs.confirm_branch == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate cumulative source and original UI files
        shell: bash
        run: |
          set -euo pipefail
          for f in atlas94-ui.js atlas95-ui.js atlas96-cluster-core.js atlas96-garage.js atlas97-connect.js atlas97-journey.js; do node --check "$f"; done
          test -s art/atlas97-proposed-loki-scaly-hero.webp
          test -s docs/APPROVED-DESIGNED-BRAND-MASTER.png
          test -s art/atlas86-loki-approved.webp
          test -s art/atlas86-scaly-approved.webp
          python -m py_compile tools/apply_atlas95.py tools/apply_atlas96.py tools/apply_atlas97.py tools/audit_atlas96.py tools/audit_atlas97.py tools/test_atlas96.py tools/test_atlas97.py scripts/sync_gtadb_vi.py
          python tools/test_atlas96.py
          python tools/test_atlas97.py
      - name: Preview exact cumulative changes
        run: python tools/apply_atlas97.py --check
      - name: Apply Atlas 9.4 through 9.7 forward-only
        run: python tools/apply_atlas97.py
      - name: Regenerate source-licensed community VI snapshot (fail soft on upstream outage)
        shell: bash
        run: |
          if ! python scripts/sync_gtadb_vi.py; then
            echo "::warning::Upstream GTADB.org sync unavailable; keep cached/starter sources and explicitly unverified labels."
          fi
      - name: Validate integrated scripts and produce 59-page website audit
        shell: bash
        run: |
          set -euo pipefail
          node --check atlas-research.js
          node --check atlas90-gallery.js
          python tools/audit_atlas97.py
          python tools/test_atlas96.py
          python tools/test_atlas97.py
      - name: Idempotent installation gate
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_atlas97.py --check | tee /tmp/atlas97-repeat.log
          grep 'Would update 0 files' /tmp/atlas97-repeat.log
          grep 'Would update 0 Atlas 9.6 files' /tmp/atlas97-repeat.log
          grep 'Would update 0 Atlas 9.7 page headers' /tmp/atlas97-repeat.log
      - name: Commit cumulative release to development (never main)
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = development
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          for path in data/gtadb-6.json data/gtadb-6-manifest.json docs/ATLAS96-SITE-AUDIT.generated.json docs/ATLAS97-HUMAN-UX-AUDIT.generated.json; do
            if test -f "$path"; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'feat(atlas): cumulative 9.7 researched map, garage and visitor journey'
            git pull --rebase origin development
            git push origin HEAD:development
          else
            echo 'Already installed; no new commit'
          fi
