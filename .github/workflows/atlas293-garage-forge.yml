name: Atlas 29.3 - Garage to Forge handoff
on:
  pull_request:
    branches: [development]
    paths:
      - 'atlas263-forge-collections.js'
      - 'atlas222-characters.js'
      - 'scripts/test_atlas2150_product_contracts.py'
      - 'atlas93-garage.js'
      - 'atlas101-configurator.js'
      - 'atlas-vehicle-configurator.html'
      - 'scripts/test_atlas293_garage_forge_handoff.py'
      - 'scripts/test_atlas293_garage_forge_browser.py'
      - 'scripts/test_atlas293_lamar_appearances.py'
      - 'scripts/test_atlas293_character_portraits_browser.py'
      - '.github/workflows/atlas293-garage-forge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  garage-forge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip unrelated pull-request synchronizations
        id: scope
        env:
          ATLAS_PR_ACTION: ${{ github.event.action }}
        run: python3 scripts/atlas300-ci-delta.py .github/workflows/atlas293-garage-forge.yml
      - run: python scripts/test_atlas293_garage_forge_handoff.py
        if: steps.scope.outputs.run == 'true'
      - run: python scripts/test_atlas293_lamar_appearances.py
        if: steps.scope.outputs.run == 'true'
      - run: python scripts/test_atlas2150_product_contracts.py
        if: steps.scope.outputs.run == 'true'
      - run: node --check atlas93-garage.js
        if: steps.scope.outputs.run == 'true'
      - run: node --check atlas101-configurator.js
        if: steps.scope.outputs.run == 'true'
      - run: node scripts/build-cloudflare.cjs
        if: steps.scope.outputs.run == 'true'
      - run: python scripts/audit_published.py
        if: steps.scope.outputs.run == 'true'
      - name: Focused real Chromium Garage-to-Forge journey
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/test_atlas293_garage_forge_browser.py
          python scripts/test_atlas293_character_portraits_browser.py
