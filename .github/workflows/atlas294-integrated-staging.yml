name: Atlas 29.4 - integrated staging acceptance
on:
  pull_request:
    branches: [development]
    paths:
      - 'atlas93-garage.js'
      - 'atlas222-characters.js'
      - 'atlas101-configurator.js'
      - 'atlas292-shortcut-filter.js'
      - 'atlas290-*.js'
      - 'atlas290-*.css'
      - 'atlas-dashboard.html'
      - 'atlas-vi.html'
      - 'scripts/test_atlas29*.py'
      - '.github/workflows/atlas294-integrated-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas294-integrated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  integrated-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cross-feature and source regression
        run: |
          python scripts/test_atlas294_integration.py
          python scripts/test_atlas291_dual_leonida.py
          python scripts/test_atlas292_shortcuts.py
          python scripts/test_atlas293_lamar_appearances.py
          python scripts/test_atlas293_garage_forge_handoff.py
          python scripts/test_atlas2150_product_contracts.py
          node --check atlas93-garage.js
          node --check atlas222-characters.js
          node --check atlas101-configurator.js
          node --check atlas292-shortcut-filter.js
      - name: Build audited Cloudflare release payload
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install focused Chromium
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Test interacting components in real browser
        run: |
          python scripts/test_atlas290_vi_day_browser.py
          python scripts/test_atlas290_poster_browser.py
          python scripts/test_atlas293_garage_forge_browser.py
          python scripts/test_atlas293_character_portraits_browser.py
