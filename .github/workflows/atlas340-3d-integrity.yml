name: Atlas 34.0 - 3D map geometry integrity
on:
  pull_request:
    branches: [feature/atlas294-integrated-staging-20261122, development]
    paths:
      - 'atlas-3d.js'
      - 'elevation-5.bin'
      - 'elevation-6.bin'
      - 'scripts/audit_3d_heightfields.py'
      - 'scripts/test_heightfield_import.cjs'
      - '.github/workflows/atlas340-3d-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_3d_heightfields.py
      - run: node scripts/test_heightfield_import.cjs
