name: Atlas 34.0 - daily GTA VI source research
on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official GTA VI, GTA Online, media and licensed source entry points
        run: python scripts/monitor_gta_sources.py > source-snapshot.json
      - uses: actions/upload-artifact@v7
        with:
          name: gta-source-snapshot
          path: source-snapshot.json
          retention-days: 14
