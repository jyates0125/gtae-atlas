name: Refresh licensed GTA VI landmarks
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gtadb-vi-sync
  cancel-in-progress: false

jobs:
  refresh-vi:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate snapshot generator
        run: python scripts/test_sync_gtadb_vi.py
      - name: Refresh source-licensed GTA VI data
        run: python scripts/sync_gtadb_vi.py
      - name: Check snapshot structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/gtadb-6.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('data/gtadb-6-manifest.json').read_text(encoding='utf-8'))
          assert data['schema'] == 2 and data['status'] == 'community-provisional'
          assert data['license'] == 'CC BY 4.0'
          assert data['sourceHash'] == manifest['sourceHash']
          assert data['count'] == len(data['records'])
          assert data['mappedCount'] >= 500
          PY
      # Keep protected main untouched. The updater may only propose changes
      # to the two source-licensed snapshot files, never application code.
      - name: Propose snapshot changes through a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            data/gtadb-6.json
            data/gtadb-6-manifest.json
          branch: automation/gtadb-vi-snapshot
          delete-branch: true
          commit-message: "data: refresh CC BY 4.0 GTADB VI landmark snapshot"
          title: "data: refresh licensed GTA VI landmark snapshot"
          body: |
            Automated, source-attributed GTA VI research snapshot.
            These records are provisional, not verified gameplay positions.
            Review upstream changes, licensing and validation before merging.
          labels: |
            data-update
          draft: false
