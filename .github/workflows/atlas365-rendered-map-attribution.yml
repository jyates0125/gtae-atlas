name: Atlas 36.5 - rendered modern map source and world UX
on:
  pull_request:
    branches: [feature/atlas294-integrated-staging-20261122, development]
    paths:
      - 'atlas364-map-credit.js'
      - 'atlas364-map-credit.css'
      - 'atlas220-vi-mobile.css'
      - 'scripts/test_atlas365_modern_map_browser.py'
      - 'docs/ATLAS365-MODERN-MAP-BROWSER-ACCEPTANCE.md'
      - '.github/workflows/atlas365-rendered-map-attribution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendered-modern-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Source and deterministic view metadata checks
        run: node scripts/test_atlas364_map_credits.cjs
      - name: Build actual Cloudflare public output
        run: node scripts/build-cloudflare.cjs
      - name: Verify public-only boundary
        run: python scripts/audit_published.py
      - name: Install focused Chromium
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Test 3 maps x 2 viewports and live world/style changes
        run: python scripts/test_atlas365_modern_map_browser.py
