name: Dashboard character navigation
on:
  pull_request:
    paths:
      - atlas223-home.js
      - atlas-dashboard.html
      - scripts/test_atlas223_home.py
      - scripts/test_atlas223_home_browser.py
      - .github/workflows/dashboard-character-navigation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
          - os: windows-2022
            browser: msedge
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - if: matrix.browser == 'chromium'
        run: python -m playwright install --with-deps chromium
      - run: python scripts/test_atlas223_home.py
      - run: node scripts/build-cloudflare.cjs
      - run: python scripts/test_atlas223_home_browser.py
        env:
          ATLAS_BROWSER: ${{ matrix.browser }}
