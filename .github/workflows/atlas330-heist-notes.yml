name: Atlas 33.0 - safe guest mission notes in fifteen heist workspaces
on:
  pull_request:
    branches: [feature/atlas294-integrated-staging-20261122]
    paths:
      - 'atlas164-heist-workspace.js'
      - 'atlas164-heist-workspace.css'
      - 'heist-directory.js'
      - 'scripts/test_atlas330_heist_notes.py'
      - 'scripts/test_atlas330_heist_notes_browser.py'
      - '.github/workflows/atlas330-heist-notes.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas330-notes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused-heist-notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Source correctness for the three changed heist assets
        run: |
          node --check atlas164-heist-workspace.js
          node --check heist-directory.js
          python scripts/test_atlas330_heist_notes.py
          python -m py_compile scripts/test_atlas330_heist_notes_browser.py
      - name: Build and check the exact Cloudflare payload
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install Chromium only (edited notes, three screen sizes)
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Verify recovery and non-destructive real-browser workflows
        run: python scripts/test_atlas330_heist_notes_browser.py
      - name: Retain phone landscape and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas330-heist-guest-notes-visuals
          path: qa-evidence/chromium/atlas330-heist-note-recovery-*.png
          if-no-files-found: warn
          retention-days: 14
