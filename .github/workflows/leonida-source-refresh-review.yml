name: Leonida current map and licensed source refresh
on:
  pull_request:
    branches: [development]
    paths:
      - 'data/gtadb-6.json'
      - 'data/gtadb-6-manifest.json'
      - 'atlas.js'
      - 'atlas-vi.html'
      - 'scripts/test_atlas290_vi_day.py'
      - 'scripts/test_atlas290_vi_day_browser.py'
      - 'scripts/test_atlas291_dual_leonida.py'
      - 'scripts/test_vi_research_manifest.py'
      - '.github/workflows/leonida-source-refresh-review.yml'
permissions:
  contents: read
jobs:
  leonida-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact snapshot and map contracts
        run: |
          node --check atlas.js
          python scripts/test_vi_research_manifest.py
          python scripts/test_atlas290_vi_day.py
          python scripts/test_atlas291_dual_leonida.py
          python scripts/test_sync_gtadb_vi.py
      - name: Build public payload
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install Chromium
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Day default, source index, view switching and poster isolation
        run: |
          python scripts/test_atlas290_vi_day_browser.py
          python scripts/test_atlas290_poster_browser.py
          python scripts/test_atlas191_first_visit_browser.py
