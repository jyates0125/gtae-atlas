name: Atlas 30.4 - character archive coverage and mobile profiles
on:
  pull_request:
    branches: [development, feature/atlas294-integrated-staging-20261122]
    paths:
      - 'atlas222-characters.js'
      - 'atlas222-characters.css'
      - 'atlas-characters.html'
      - 'scripts/test_atlas334_classic_cast.py'
      - 'scripts/test_atlas335_world_catalogs.py'
      - 'atlas90-shortcuts.js'
      - 'atlas100-showroom.js'
      - 'data/atlas-universe-profiles.json'
      - 'art/lamar-*.webp'
      - 'scripts/test_atlas293_character_portraits_browser.py'
      - 'scripts/test_atlas304_character_archive.py'
      - 'scripts/test_atlas304_character_archive_browser.py'
      - '.github/workflows/atlas304-character-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas304-characters-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  archive-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source contracts and history
        run: |
          python scripts/test_atlas304_character_archive.py
          node tests/atlas292-character-deeplinks.test.cjs
      - name: Build audited public payload
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install focused Chromium
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Test archive filters, profiles and mobile
        run: |
          python scripts/test_atlas304_character_archive_browser.py
          python scripts/test_atlas293_character_portraits_browser.py
          python scripts/test_atlas334_classic_cast.py
          python scripts/test_atlas335_world_catalogs.py
      - name: Save owner review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas304-character-archive-phone
          path: qa-evidence/chromium/atlas304-characters-*.png
          if-no-files-found: warn
          retention-days: 14
