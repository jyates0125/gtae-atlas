name: Atlas 34.4 - classic collection save recovery release preflight
on:
  pull_request:
    branches: [feature/atlas294-integrated-staging-20261122, development]
    paths:
      - 'scripts/test_atlas150_classic_slots.py'
      - 'scripts/test_atlas_character_portraits.py'
      - 'atlas98b-progress.js'
      - 'atlas98-classic.js'
      - 'atlas98b-collection-data.js'
      - '.github/workflows/atlas344-classic-release-preflight.yml'
permissions:
  contents: read
jobs:
  classic-checklist-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax and classic safe-save release contract
        run: |
          node --check atlas98b-progress.js
          node --check atlas98-classic.js
          python scripts/test_atlas150_classic_slots.py
  heist-notes-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build real public pages
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install Chromium for actual restored notes and private route checks
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Test real browser heist note value preservation and invalid backup refusal
        env:
          ATLAS_BROWSER: chromium
        run: python scripts/test_atlas_character_portraits.py
