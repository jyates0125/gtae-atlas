name: Atlas 30.6 - GTA IV and episodes map detail return
on:
  pull_request:
    branches: [development, feature/atlas294-integrated-staging-20261122]
    paths:
      - 'atlas-iv.html'
      - 'atlas-iv.js'
      - 'scripts/test_atlas332_bird_saves.py'
      - 'atlas306-iv-return.js'
      - 'atlas306-iv-return.css'
      - 'scripts/test_atlas306_iv_return.py'
      - 'scripts/test_atlas306_iv_return_browser.py'
      - '.github/workflows/atlas306-iv-return.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas306-iv-return-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  iv-return-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source contract and map JavaScript syntax
        run: python scripts/test_atlas306_iv_return.py
      - name: Audit built Cloudflare payload
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install Chromium
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Check episode return and map state on four viewports
        run: |
          python scripts/test_atlas306_iv_return_browser.py
          python scripts/test_atlas332_bird_saves.py
      - name: Save TLaD phone evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas306-liberty-city-map-return
          path: qa-evidence/chromium/atlas306-tlad-return-phone.png
          if-no-files-found: warn
          retention-days: 14
