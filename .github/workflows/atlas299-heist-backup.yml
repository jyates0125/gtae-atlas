name: Atlas 29.9 - heist backup safety
on:
  pull_request:
    branches: [development]
    paths:
      - 'atlas299-heist-backup.js'
      - 'atlas299-heist-backup.css'
      - 'heist-pages.js'
      - 'scripts/test_atlas299_heist_backup.py'
      - 'scripts/test_atlas299_heist_backup_browser.py'
      - '.github/workflows/atlas299-heist-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas299-heist-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  heist-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Skip unrelated PR synchronization commits
        id: scope
        env:
          ATLAS_PR_ACTION: ${{ github.event.action }}
        run: python3 scripts/atlas300-ci-delta.py .github/workflows/atlas299-heist-backup.yml
      - name: Three-key guest backup source contract and scripts
        if: steps.scope.outputs.run == 'true'
        run: |
          python scripts/test_atlas299_heist_backup.py
          python scripts/test_atlas164_heist_workspace.py
      - name: Build audited Cloudflare site
        if: steps.scope.outputs.run == 'true'
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install Chromium for guest-save journey
        if: steps.scope.outputs.run == 'true'
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium
      - name: Check non-destructive export and import, 390px and 1440px
        if: steps.scope.outputs.run == 'true'
        run: python scripts/test_atlas299_heist_backup_browser.py
