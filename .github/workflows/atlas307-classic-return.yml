name: Atlas 30.7 - safe return to seven classic notebooks
on:
  pull_request:
    branches: [development, feature/atlas294-integrated-staging-20261122]
    paths:
      - 'map-hub.html'
      - 'atlas307-classic-editor-return.js'
      - 'atlas307-classic-editor-return.css'
      - 'scripts/test_atlas307_classic_return.py'
      - 'scripts/test_atlas307_classic_return_browser.py'
      - '.github/workflows/atlas307-classic-return.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classic-return:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify safe editor source and JavaScript syntax
        run: python scripts/test_atlas307_classic_return.py
      - name: Build audited published pages
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install scoped Chromium
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Seven world editor return interactions at phone and desktop widths
        run: python scripts/test_atlas307_classic_return_browser.py
      - name: Capture representative device evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlas307-classic-return
          path: qa-evidence/chromium/atlas307-classic-*.png
          if-no-files-found: warn
          retention-days: 14
