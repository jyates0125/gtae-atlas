name: Atlas 32.0 - private Forge design comparison
on:
  pull_request:
    branches: [feature/atlas294-integrated-staging-20261122]
    paths:
      - 'atlas263-forge-collections.js'
      - 'atlas-forge-collections.html'
      - 'atlas320-forge-compare.css'
      - 'tests/atlas320-forge-comparison.test.cjs'
      - 'scripts/test_atlas320_forge_comparison_browser.py'
      - '.github/workflows/atlas320-forge-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas320-forge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  saved-design-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify read-only comparison, saved collection identity and syntax
        run: |
          node --check atlas263-forge-collections.js
          node tests/atlas320-forge-comparison.test.cjs
          node tests/atlas296-forge-collections.test.cjs
          python -m py_compile scripts/test_atlas320_forge_comparison_browser.py
      - name: Build and audit public Cloudflare preview files
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - name: Install focused Chromium
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Test two designs in phone, landscape and desktop
        run: python scripts/test_atlas320_forge_comparison_browser.py
      - name: Retain visual viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas320-forge-compare-phone-desktop
          path: qa-evidence/chromium/atlas320-forge-compare-*.png
          if-no-files-found: warn
          retention-days: 14
