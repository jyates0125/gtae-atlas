name: Atlas 35.1 - Cloudflare command compatibility and secure output
on:
  pull_request:
    branches: [main, development]
    paths:
      - 'scripts/build-cloudfare.cjs'
      - 'scripts/build-cloudflare.cjs'
      - 'scripts/forge-pbr-lab/release-policy.mjs'
      - 'scripts/forge-pbr-lab/verify-published-models.mjs'
      - 'assets/forge/**'
      - 'scripts/test_atlas351_cloudflare_build_command.py'
      - 'docs/ATLAS351-MAIN-PRODUCTION-ACTIVATION-20261123.md'
      - '.github/workflows/atlas351-cloudflare-command-contract.yml'
permissions:
  contents: read
jobs:
  secure-command-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check compatibility is only a forwarding entry point
        run: |
          node --check scripts/build-cloudfare.cjs
          node --check scripts/build-cloudflare.cjs
          node --check scripts/forge-pbr-lab/verify-published-models.mjs
      - name: Execute both real Cloudflare build commands and audit each public tree
        run: |
          python scripts/test_atlas351_cloudflare_build_command.py
          python scripts/audit_published.py
