name: Atlas 40.5 - heist credits
on:
  pull_request:
    branches: [development]
    paths:
      - 'heist-*.html'
      - 'heists.html'
      - 'atlas-credits.html'
      - 'scripts/test_atlas405_heist_credits.py'
      - '.github/workflows/atlas405-heist-credits.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heist-credits:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
          python scripts/test_atlas405_heist_credits.py
