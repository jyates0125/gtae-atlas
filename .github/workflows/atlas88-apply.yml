name: Apply Atlas 9.0 Designed Brand full-site release
on:
  push:
    branches: [development]
    paths:
      - 'atlas86-*'
      - 'atlas87-*'
      - 'atlas88-*'
      - 'atlas89-*'
      - 'atlas90-*'
      - 'tools/apply_atlas90.py'
      - 'art/atlas86-*'
      - 'tools/apply_atlas86.py'
      - 'tools/apply_atlas87.py'
      - 'tools/apply_atlas88.py'
      - 'tools/apply_atlas89.py'
      - '.github/workflows/atlas88-apply.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: team-jura-88-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release assets
        run: |
          for f in atlas86-ui.js atlas86-sa-enhance.js atlas86-cayo.js atlas87-daily.js atlas87-all-maps.js atlas88-events.js atlas89-shell.js; do node --check "$f"; done
          python -m py_compile tools/apply_atlas86.py tools/apply_atlas87.py tools/apply_atlas88.py tools/apply_atlas89.py tools/apply_atlas90.py
          node --check atlas90-gallery.js
          node --check atlas90-shortcuts.js
          test -s art/atlas86-crew-approved.webp
          test -s art/atlas86-loki-approved.webp
          test -s art/atlas86-scaly-approved.webp
      - name: Integrate approved brand and existing map tools
        run: |
          python tools/apply_atlas86.py
          python tools/apply_atlas87.py
          python tools/apply_atlas88.py
          python tools/apply_atlas89.py
          python tools/apply_atlas90.py
      - name: Validate repeat-safe integration
        run: |
          python tools/apply_atlas86.py
          python tools/apply_atlas87.py
          python tools/apply_atlas88.py
          python tools/apply_atlas89.py
          python tools/apply_atlas90.py
          node --check atlas.js
          python - <<'PY'
          from pathlib import Path
          for name in ('atlas-online.html','atlas87-daily.html'):
              s=Path(name).read_text()
              assert s.count('atlas88-events.js?v=88')==1,name
          for name in ('atlas.html','atlas-online.html','atlas-vi.html'):
              s=Path(name).read_text()
              assert s.count('atlas86-ui.js?v=86')==1,name
          assert 'window.TeamJuraEventIcon88?.forRecord(r)' in Path('atlas.js').read_text()
          assert "['loki,view','Loki · DUPZOR V51']," not in Path('atlas.js').read_text()
          assert all(Path(p).exists() for p in ('atlas90-weapons.html','atlas90-vehicles5.html','atlas90-vehicles6.html'))
          assert all(Path(n).read_text().count('atlas89-shell.js?v=89')==1 for n in ('atlas.html','atlas-online.html','maps.html','atlas-cayo.html','atlas81-hq.html'))
          print('PASS: integration references and source hooks')
          PY
      - name: Commit integrated source back to development
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate Atlas 9.0 designed brand pictured catalogs'
            git pull --rebase origin development
            git push origin HEAD:development
          fi
