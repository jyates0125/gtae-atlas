name: Atlas 39.0.4 - cinematic header artwork acceptance
on:
  push:
    branches: [feature/atlas294-integrated-staging-20261122]
    paths:
      - 'art/jura3904-*.webp'
      - atlas3903-header-refresh.css
      - atlas8-preview.html
      - atlas8-preview.js
      - atlas223-home.js
      - docs/ATLAS3904-HEADER-ART.json
      - scripts/test_atlas3904_header_pack.py
      - scripts/test_atlas3905_header_browser.py
      - scripts/build-cloudflare.cjs
      - 'art/*.webp'
      - guides.html
      - atlas-dashboard.html
      - atlas-news.html
      - atlas-cheats.html
      - atlas-activities.html
      - atlas-account.html
      - atlas-toolkit.html
      - atlas-checklist.html
      - .github/workflows/atlas3904-header-art.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  header-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: node scripts/build-cloudflare.cjs
      - run: python scripts/test_atlas162_subject_heroes.py
      - run: python scripts/test_atlas223_home.py
      - run: python scripts/test_atlas3904_header_pack.py
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_atlas3905_header_browser.py
      - run: python scripts/test_atlas223_home_browser.py
      - run: python scripts/browser_smoke.py
        env:
          ATLAS_SMOKE_ONLY: atlas-dashboard.html,guides.html,atlas-news.html,atlas-cheats.html,atlas-activities.html,atlas-account.html,atlas-toolkit.html,atlas-checklist.html,atlas8-preview.html,elario.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas3904-header-browser-evidence
          path: qa-evidence/
          if-no-files-found: warn
          retention-days: 14
