name: Atlas 37.7 map center and release contracts
on:
  pull_request:
    branches: [development]
    paths:
      - 'atlas-navigation.js'
      - 'atlas.html'
      - 'atlas-online.html'
      - 'atlas-vi.html'
      - 'scripts/test_atlas377_map_center.cjs'
      - 'scripts/test_atlas222_vi_launch.py'
      - 'scripts/test_atlas290_vi_day.py'
      - 'scripts/test_atlas220_vi_mobile.py'
      - 'scripts/test_atlas366_heightfield_first.cjs'
      - '.github/workflows/atlas377-map-center.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-and-release-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check atlas-navigation.js && node scripts/test_atlas377_map_center.cjs && node scripts/test_atlas373_gps.cjs
      - run: python scripts/test_atlas290_vi_day.py && python scripts/test_atlas220_vi_mobile.py && python scripts/test_atlas222_vi_launch.py
      - run: node scripts/test_atlas366_heightfield_first.cjs && node scripts/build-cloudflare.cjs
