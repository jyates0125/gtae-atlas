name: Atlas 47.1.3 - Universe and Armory connections
on:
  pull_request:
    branches: [development, feature/atlas4710-vi-roster-expansion]
    paths:
      - 'atlas100-universe.*'
      - 'atlas101-configurator.js'
      - 'atlas-vehicle-configurator.html'
      - 'atlas90-gallery.js'
      - 'atlas90-vehicles6.html'
      - 'atlas4714-*.js'
      - 'atlas-database.html'
      - 'atlas-credits.html'
      - 'atlas4713-universe-credits.js'
      - 'atlas192-weapons6.js'
      - 'scripts/test_atlas4713_universe_browser.py'
      - '.github/workflows/atlas4713-universe-visuals.yml'
permissions:
  contents: read
concurrency:
  group: atlas4713-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  universe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
          - os: windows-latest
            browser: msedge
    runs-on: ${{ matrix.os }}
    env:
      ATLAS_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          node --check atlas100-universe.js
          node --check atlas192-weapons6.js
          node --check atlas4713-universe-credits.js
          node --check atlas4714-vi-vehicle-visuals.js
          node --check atlas101-configurator.js
          node --check atlas90-gallery.js
          python scripts/test_atlas293_garage_forge_handoff.py
          python scripts/test_universe_100.py
          python scripts/test_atlas192_world_completion.py
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
      - run: |
          python -m pip install playwright==1.58.0
          python -m playwright install ${{ matrix.browser }}
          python scripts/test_atlas4713_universe_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas4713-universe-png-${{ matrix.browser }}
          path: qa-evidence/atlas4713/
          if-no-files-found: warn
          retention-days: 21
