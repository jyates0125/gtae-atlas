name: Atlas 29.8 - mission phase map kit and portable routes
on:
  pull_request:
    branches: [development, feature/atlas294-integrated-staging-20261122]
    paths:
      - 'atlas298-heist-map-kit.js'
      - 'atlas298-heist-map-kit.css'
      - 'atlas167-heist-focus.js'
      - 'heist-pages.js'
      - 'tests/atlas298-heist-map-kit.test.cjs'
      - 'scripts/test_atlas298_heist_map_kit_browser.py'
      - '.github/workflows/atlas298-heist-map-kit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas298-phase-maps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mission-map-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fourteen mission maps, map backup security and syntax
        run: |
          node --check atlas298-heist-map-kit.js
          node --check atlas167-heist-focus.js
          node --check heist-pages.js
          node tests/atlas298-heist-map-kit.test.cjs
          python -m py_compile scripts/test_atlas298_heist_map_kit_browser.py
      - name: Build actual Cloudflare payload and inspect all emitted assets
        run: |
          node scripts/build-cloudflare.cjs
          python scripts/audit_published.py
          test -f public/atlas298-heist-map-kit.js
          test -f public/atlas298-heist-map-kit.css
      - name: Install Chromium for affected heist workspaces only
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install chromium
      - name: Phone and desktop mission-map interaction and restore
        run: python scripts/test_atlas298_heist_map_kit_browser.py
      - name: Save actual source-scoped mission map visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas298-non-cayo-heist-maps-phone-desktop
          path: qa-evidence/chromium/atlas298-*.png
          if-no-files-found: warn
          retention-days: 14
