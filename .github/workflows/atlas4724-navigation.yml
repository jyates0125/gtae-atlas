name: Atlas 47.2.4 - canonical game navigation journeys
on:
  pull_request:
    branches: [development]
    paths:
      - 'atlas132-nav.js'
      - 'atlas132-nav.css'
      - 'atlas*.html'
      - 'index.html'
      - 'maps.html'
      - 'atlas98-flow.js'
      - 'atlas93-global.js'
      - 'atlas97-connect.js'
      - 'atlas100-showroom.js'
      - 'atlas223-home.js'
      - 'atlas98-portal.js'
      - 'atlas97-journey.js'
      - 'scripts/test_atlas4725_player_entry.py'
      - 'scripts/test_design_review_118.py'
      - '.github/workflows/atlas-advisory-visual-review.yml'
      - 'scripts/test_atlas4724_navigation_journeys.py'
      - '.github/workflows/atlas4724-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas4724-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  journeys:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            browser: chromium
          - runner: windows-latest
            browser: msedge
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check atlas132-nav.js
      - run: python scripts/test_atlas4725_player_entry.py
      - run: python scripts/test_launch_130.py
      - run: python scripts/test_atlas153_welcome_social.py
      - run: python scripts/test_atlas223_home.py
      - run: python scripts/test_design_review_118.py
      - run: node scripts/build-cloudflare.cjs
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install ${{ matrix.browser }}
      - run: python scripts/test_atlas4724_navigation_journeys.py
        env:
          ATLAS_BROWSER: ${{ matrix.browser }}
