name: Apply Atlas 9.3 cumulative Designed Brand upgrade
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atlas93-development-integration
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref_name == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Atlas 9.2 and 9.3 package components
        run: |
          python -m py_compile tools/apply_atlas92.py tools/apply_atlas93.py tools/generate_atlas93_art.py tools/test_atlas93.py
          python tools/generate_atlas93_art.py
      - name: Integrate 9.2 forward-only functionality
        run: python tools/apply_atlas92.py
      - name: Integrate 9.3 Garage, Dispatch, and Intelligence
        run: python tools/apply_atlas93.py
      - name: Test preserved map and atlas93 integration
        run: python tools/test_atlas93.py
      - name: Commit integration to development only
        run: |
          git config user.name 'Team Jura Atlas updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add art/atlas93-*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'feat: install Atlas 9.3 garage dispatch and refreshed UX'
            git pull --rebase origin development
            git push origin HEAD:development
          fi
